name: Repository security
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan current tree without printing secret values
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          status=0
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner \
            --log-level error --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" || status=$?
          python3 - "$RUNNER_TEMP/gitleaks.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = Path(sys.argv[1])
          if report.exists():
              for finding in json.loads(report.read_text()):
                  print(json.dumps({"file": finding["File"], "line": finding["StartLine"], "rule": finding["RuleID"]}))
          PY
          exit "$status"
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node --test tests/chat.test.js
      - run: npm ci --ignore-scripts
      - run: npm run build
